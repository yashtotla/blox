# Without a config, Ruff's defaults flag nearly every import block in this
# repo (sorting, unused imports, modernization nags on research code).

# Vendored Synergy model-training code (needs torch/apex/DALI, never imported
# by the simulator) and dead code moved to graveyard/. force-exclude makes the
# editor skip them too.
extend-exclude = ["workload_synergy", "graveyard"]
force-exclude = true

[lint]
ignore = [
    # Imports
    "I001",    # unsorted imports
    "PLR0402", # `import a.b as b` -> `from a import b`
    "PLC0414", # `import x as x`

    # Style only: none of these change what the code does.
    "UP",      # modernization: f-strings, `List` -> `list`, `class A(object)`, old typing/__future__/builtins imports
    "C4",      # comprehensions: `dict()` -> `{}`, generator -> list comprehension
    "RET501",  # explicit `return None`
    "PLR1711", # bare `return` at end of function
    "SIM102",  # nested `if` that could be one `if`
    "SIM103",  # `if c: return True else: return False`
    "SIM114",  # `if` branches with identical bodies
    "SIM118",  # `k in d.keys()` -> `k in d`
    "SIM401",  # `if k in d` -> `d.get(k, default)`
    "PLC0206", # loop over dict keys, then index -> `.items()`
    "PLR1733", # `d[k]` inside `enumerate(d)` loop
    "PLR1730", # `if a > b: a = b` -> `min()`
    "PLR2044", # empty comment
    "PIE790",  # unnecessary `pass`
    "RUF015",  # `list(x)[0]` -> `next(iter(x))`
    "RUF046",  # `int()` around a value that's already an int
    "RUF059",  # unused variable from tuple unpacking
    "RUF100",  # `# noqa` for a rule that isn't enabled
    "DTZ007",  # `datetime.strptime` without timezone
    "D419",    # empty docstring
    "TRY002",  # `raise Exception(...)` instead of a custom class
    "EXE001",  # shebang on a file without the executable bit
    "N999",    # module file name isn't a valid identifier (e.g. first-gpu.py)
]

[lint.per-file-ignores]
# Package `__init__.py` files import names so other code can get them from the
# package (models/__init__.py feeds the globals() lookup in workload/model.py).
"__init__.py" = ["F401"]
